<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>日本語マスター</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <!-- ホーム画面 -->
        <div id="home">

            <h1>日本語マスター</h1>

            <div class="stats">
                JLPT学習システム

                <br>

                入門 / N5 / N4 / N3 / N2 / N1

                <br>

                N1〜N5 完全対応版
            </div>

            <button class="level" onclick="startIntro()">
                入門
            </button>

            <button class="level" onclick="startN5()">
                N5
            </button>

            <button class="level" onclick="startN4()">
                N4
            </button>

            <button class="level n3" onclick="startN3()">
                N3
            </button>

            <button class="level n2" onclick="startN2()">
                N2
            </button>

            <button class="level n1" onclick="startN1()">
                N1
            </button>

            <button class="learned"
                onclick="showLearnedList()">
                学習済み一覧
            </button>

        </div>

        <!-- 学習画面 -->
        <div id="quiz" class="hidden">

            <h1>学習</h1>

            <p id="progress"></p>

            <h2 id="question"></h2>

            <div id="choices"></div>

            <div id="result"></div>

            <div id="explanation"></div>

            <button class="next"
                onclick="nextQuestion()">
                次の問題
            </button>

            <button
                id="learnedButton"
                class="learned"
                onclick="markAsLearned()">
                学習済みにする
            </button>

            <button class="back"
                onclick="backToHome()">
                ホームに戻る
            </button>

            <button class="reset"
                onclick="resetProgress()">
                このレベルの進捗をリセット
            </button>

            <div class="stats">

                正解数：
                <span id="score">0</span>

                <br>

                正答率：
                <span id="rate">0</span>%

            </div>

        </div>

        <!-- 学習済み一覧 -->
        <div id="learnedList" class="hidden">

            <h1>学習済み一覧</h1>

            <div id="learnedListContent"></div>

            <button class="back"
                onclick="closeLearnedList()">
                ホームに戻る
            </button>

        </div>

    </div>

    <!-- 問題データを先に読み込む -->
<script src="data/intro.js"></script>
<script src="data/n5.js"></script>
<script src="data/n4.js"></script>
<script src="data/n3.js"></script>
<script src="data/n2.js"></script>
<script src="data/n1.js"></script>

    <!-- アプリ本体を最後に読み込む -->
    <script src="app.js"></script>

</body>

</html>
